[tool:pytest]
# pytest configuration file

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests (runtime > 1s)
    network: Tests requiring network connection
    gpu: Tests requiring GPU
    
# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    
# Coverage configuration
# addopts = --cov=src/feduwacomm --cov-report=html --cov-report=term-missing

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*
    
# Minimum version requirement
minversion = 6.0

# Parallel testing (requires pytest-xdist)
# addopts = -n auto

# Timeout settings (requires pytest-timeout)
# timeout = 300
# timeout_method = thread
