server:
  port: 8080
  # 移除全局context-path，在配置类中分别配置

spring:
  application:
    name: feduwacomm-backend

  profiles:
    active: dev # 默认开发环境

  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/feduwacomm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: NBNB
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # 禁用 Spring Boot 默认的数据库初始化（使用自定义初始化）
  sql:
    init:
      mode: never

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

# 日志配置
logging:
  level:
    com.feduwacomm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  # 数据库日志配置
  db:
    enabled: false # 默认不启用数据库日志，可通过环境变量覆盖

# FedUWAComm模块配置
feduwacomm:
  module:
    name: feduwacomm # 模块名称，用于UUID前缀

# JWT配置
jwt:
  secret: ${JWT_SECRET:feduwacomm_jwt_secret_key_2024_water_acoustic_federated_learning}
  expiration: ${JWT_EXPIRATION:86400} # 24小时，单位：秒
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800} # 7天，单位：秒
