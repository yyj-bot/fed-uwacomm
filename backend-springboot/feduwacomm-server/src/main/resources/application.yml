server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: feduwacomm-backend

  profiles:
    active: dev # 默认开发环境

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/feduwacomm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: NBNB
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

# 日志配置
logging:
  level:
    com.feduwacomm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  # 数据库日志配置
  db:
    enabled: false # 默认不启用数据库日志，可通过环境变量覆盖

# FedUWAComm模块配置
feduwacomm:
  module:
    name: feduwacomm # 模块名称，用于UUID前缀
