# 测试环境配置 - 使用H2内存数据库
spring:
  datasource:
    url: jdbc:h2:mem:feduwacomm_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # H2数据库控制台
  h2:
    console:
      enabled: true
      path: /h2-console
    
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  jpa:
    hibernate:
      ddl-auto: create-drop  # 测试环境自动创建和删除表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.feduwacomm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 测试环境禁用MyBatis日志

# 日志配置 - 测试环境简化日志输出
logging:
  level:
    com.feduwacomm: INFO
    org.springframework: WARN  
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
    org.mybatis: WARN
    org.h2: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT配置 - 双套配置（用户JWT和VM JWT）
jwt:
  user:
    secret: test-user-secret-key-for-unit-testing-only
    expiration: 86400
    refresh-expiration: 604800
  vm:
    secret: test-vm-secret-key-for-unit-testing-only
    expiration: 3600
    refresh-expiration: 86400
    
# 测试环境特殊配置
test:
  interceptors:
    vm-jwt:
      enabled: false  # 在测试环境中禁用VM JWT拦截器

# 服务器配置
server:
  port: 0 # 随机端口，避免端口冲突
