# 测试环境配置 - 使用MySQL测试数据库
spring:
  datasource:
    url: jdbc:mysql://192.168.5.22:3306/feduwacomm_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: b80db05218fe324c
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none  # 测试环境不自动创建表，使用现有数据库结构
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.feduwacomm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 启用MyBatis SQL日志

# 日志配置 - 测试环境简化日志输出
logging:
  level:
    com.feduwacomm: INFO
    org.springframework: WARN  
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
    org.mybatis: WARN
    com.mysql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT配置 - 双套配置（用户JWT和VM JWT）
jwt:
  user:
    secret: test-user-secret-key-for-unit-testing-only
    expiration: 259200
    refresh-expiration: 604800
  vm:
    secret: test-vm-secret-key-for-unit-testing-only
    expiration: 3600
    refresh-expiration: 86400
    
# 测试环境特殊配置
test:
  interceptors:
    vm-jwt:
      enabled: false  # 在测试环境中禁用VM JWT拦截器

# 服务器配置
server:
  port: 0 # 随机端口，避免端口冲突
