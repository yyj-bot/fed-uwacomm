# 测试环境配置
spring:
  datasource:
    url: jdbc:mysql://192.168.5.22:3396/feduwacomm_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: NBNBNBNBNB
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  sql:
    init:
      mode: always
      schema-locations: classpath:create-test-database.sql
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.feduwacomm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.feduwacomm: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT配置 - 双套配置（用户JWT和VM JWT）
jwt:
  user:
    secret: test-user-secret-key-for-unit-testing-only
    expiration: 86400
    refresh-expiration: 604800
  vm:
    secret: test-vm-secret-key-for-unit-testing-only
    expiration: 3600
    refresh-expiration: 86400
    
# 测试环境特殊配置
test:
  interceptors:
    vm-jwt:
      enabled: false  # 在测试环境中禁用VM JWT拦截器

# 服务器配置
server:
  port: 0 # 随机端口，避免端口冲突
